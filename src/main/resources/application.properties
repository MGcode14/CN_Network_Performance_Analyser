# Network Performance Analyzer Configuration
app.name=Network Performance Analyzer
app.version=1.0.0

# HTTP Web Server
server.http.port=8080
server.http.host=127.0.0.1

# Network Receiver Defaults
receiver.tcp.port=9091
receiver.udp.port=9092
receiver.bind.host=127.0.0.1

# Database Configuration
database.url=jdbc:sqlite:data/network_analyzer.db

# Safety & Limits
limits.max.payload.bytes=10485760
limits.max.packets=500000
limits.default.timeout.ms=5000
limits.max.rtt.samples=10000
